<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Ngữ Pháp Tiếng Anh Tương Tác - PRO</title>
    <style>
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --secondary: #f8fafc;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --border: #e2e8f0;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --sidebar-w: 300px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'UTM Avo', Arial, sans-serif; }
body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

/* Layout */
#sidebar { width: var(--sidebar-w); background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Sidebar */
.brand { padding: 1.5rem; background: var(--primary); color: white; font-weight: bold; font-size: 1.2rem; text-align: center; }
.progress-container { padding: 1rem; border-bottom: 1px solid var(--border); background: var(--secondary); }
.progress-bar { height: 8px; background: #cbd5e1; border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
.progress-fill { height: 100%; background: var(--success); width: 0%; transition: 0.3s; }
.nav-menu { flex: 1; overflow-y: auto; padding: 1rem 0; }
.nav-group { margin-bottom: 1rem; }
.nav-group-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: bold; padding: 0.5rem 1.5rem; }
.nav-item { padding: 0.75rem 1.5rem; display: block; text-decoration: none; color: var(--text-main); font-size: 0.95rem; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--secondary); }
.nav-item.active { background: #eff6ff; border-left-color: var(--primary); color: var(--primary); font-weight: bold; }
.nav-item .status { float: right; font-size: 0.8rem; }
.status.done { color: var(--success); }

/* Header */
header { height: 60px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
.header-actions button { margin-left: 1rem; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: bold; }
.header-actions button:hover { background: var(--secondary); }
.btn-primary { background: var(--primary) !important; color: white !important; border-color: var(--primary) !important; }

/* Content Area */
#content-scroll { flex: 1; overflow-y: auto; padding: 2rem; scroll-behavior: smooth; }
.container { max-width: 900px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
.unit-header { background: var(--primary); color: white; padding: 2rem; }
.unit-title { font-size: 1.8rem; margin-bottom: 0.5rem; }
.unit-obj { font-size: 1rem; opacity: 0.9; }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--card-bg); position: sticky; top: 0; z-index: 5; }
.tab { flex: 1; text-align: center; padding: 1rem; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 3px solid transparent; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab:hover:not(.active) { background: var(--secondary); }

/* Tab Content */
.tab-content { padding: 2rem; display: none; }
.tab-content.active { display: block; }

/* Theory Styles */
.theory-section { margin-bottom: 2rem; }
.theory-section h3 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; margin-bottom: 1rem; }
.theory-box { background: #eff6ff; padding: 1.5rem; border-radius: 8px; border-left: 4px solid var(--primary); margin-bottom: 1.5rem; }
.example-box { background: #f8fafc; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--success); margin: 1rem 0; }
.ex-en { font-weight: bold; font-size: 1.1rem; color: #0f172a; }
.ex-vi { font-style: italic; color: var(--text-muted); margin-top: 0.25rem; }
.ex-note { font-size: 0.9rem; margin-top: 0.5rem; color: var(--primary); }
.warning-box { background: #fffbeb; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--warning); margin: 1rem 0; }

/* Interactive Tables */
table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; }
th { background: var(--secondary); }

/* Quiz Styles */
.question-block { margin-bottom: 2rem; padding: 1.5rem; border: 1px solid var(--border); border-radius: 8px; }
.question-text { font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; }
.options { display: grid; gap: 0.5rem; }
.option { padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; background: white; text-align: left; font-size: 1rem; }
.option:hover { background: var(--secondary); border-color: var(--primary); }
.option.selected { background: #eff6ff; border-color: var(--primary); font-weight: bold; }
.option.correct { background: #d1fae5; border-color: var(--success); color: #065f46; }
.option.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; }

.feedback { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; font-size: 0.95rem; }
.feedback.success { background: #d1fae5; color: #065f46; border-left: 4px solid var(--success); display: block; }
.feedback.error { background: #fee2e2; color: #991b1b; border-left: 4px solid var(--danger); display: block; }

.submit-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
.submit-btn:hover { background: var(--primary-hover); }
.submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

/* Test Report */
.report-card { text-align: center; padding: 2rem; }
.score-circle { width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; margin: 0 auto 1.5rem auto; color: var(--primary); }
.mistakes-list { text-align: left; margin-top: 2rem; }
.mistake-item { background: #fee2e2; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; border-left: 4px solid var(--danger); }

/* Interactive Widgets */
.tenses-compare { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.tense-col { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }

/* Utilities */
.hidden { display: none !important; }
.flex { display: flex; }
.space-between { justify-content: space-between; }
.text-center { text-align: center; }

@media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav-menu { max-height: 200px; }
    .tenses-compare { grid-template-columns: 1fr; }
}

</style>
</head>

let userAnswers = []; // records first attempts for tracking
let mistakesRecord = JSON.parse(localStorage.getItem('grammar_mistakes') || '{}');

document.addEventListener('DOMContentLoaded', () => {
    renderSidebar();
    if (grammarData.length > 0) {
        loadUnit(grammarData[0].id);
    }
});

function renderSidebar() {
    const nav = document.getElementById('nav-menu');
    nav.innerHTML = '';
    
    // Group units
    const groups = {};
    grammarData.forEach(u => {
        if (!groups[u.groupName]) groups[u.groupName] = [];
        groups[u.groupName].push(u);
    });

    for (const [groupName, units] of Object.entries(groups)) {
        const groupEl = document.createElement('div');
        groupEl.className = 'nav-group';
        groupEl.innerHTML = `<div class="nav-group-title">${groupName}</div>`;
        
        units.forEach(u => {
            const item = document.createElement('a');
            item.className = 'nav-item';
            item.id = `nav-unit-${u.id}`;
            item.innerText = `Unit ${u.id}: ${u.titleEn}`;
            item.onclick = () => loadUnit(u.id);
            groupEl.appendChild(item);
        });
        nav.appendChild(groupEl);
    }
}

function loadUnit(unitId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`nav-unit-${unitId}`).classList.add('active');

    currentUnit = grammarData.find(u => u.id === unitId);
    if (!currentUnit) return;

    currentQuestionIndex = 0;
    score = 0;
    userAnswers = new Array(currentUnit.questions.length).fill(null);

    document.getElementById('unit-title-en').innerText = `Unit ${currentUnit.id}: ${currentUnit.titleEn}`;
    document.getElementById('unit-title-vi').innerText = currentUnit.titleVi;
    document.getElementById('unit-obj').innerText = `🎯 Mục tiêu: ${currentUnit.obj}`;

    switchTab('theory');
    renderTheory();
    renderQuestions();
}

function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    
    document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
}

function renderTheory() {
    const container = document.getElementById('theory-content');
    container.innerHTML = '';

    currentUnit.theory.forEach(block => {
        const sec = document.createElement('div');
        sec.className = 'theory-section';
        
        let html = `<h3>${block.title}</h3>`;
        if (block.type === 'text') {
            html += `<div class="theory-box">${block.content}</div>`;
        } else if (block.type === 'example') {
            block.examples.forEach(ex => {
                html += `
                    <div class="example-box">
                        <div class="ex-en">${ex.en}</div>
                        <div class="ex-vi">${ex.vi}</div>
                    </div>
                `;
            });
        }
        sec.innerHTML = html;
        container.appendChild(sec);
    });
}

function renderQuestions() {
    const container = document.getElementById('practice-content');
    container.innerHTML = '';
    
    currentUnit.questions.forEach((q, index) => {
        const qBlock = document.createElement('div');
        qBlock.className = 'question-block';
        qBlock.id = `qblock-${index}`;
        
        let html = `<div class="question-text">Câu ${index + 1}: ${q.q}</div>`;
        html += `<div class="options" id="opts-${index}">`;
        
        q.opts.forEach((opt, optIndex) => {
            html += `<div class="option" onclick="selectOption(${index}, ${optIndex})">${opt}</div>`;
        });
        
        html += `</div>
                 <div class="feedback" id="feedback-${index}"></div>`;
        
        qBlock.innerHTML = html;
        container.appendChild(qBlock);
    });
}

function selectOption(qIndex, optIndex) {
    const optsContainer = document.getElementById(`opts-${qIndex}`);
    if (optsContainer.classList.contains('locked')) return;

    const q = currentUnit.questions[qIndex];
    const isCorrect = (optIndex === q.ans);
    const options = optsContainer.querySelectorAll('.option');
    
    // Phát âm option vừa click
    const clickedText = q.opts[optIndex];
    speakText(clickedText);

    if (userAnswers[qIndex] === null) {
        userAnswers[qIndex] = isCorrect;
        if (isCorrect) score++;
        else recordMistake(currentUnit.id, q);
    }

    options.forEach(opt => opt.classList.remove('selected', 'wrong'));
    options[optIndex].classList.add(isCorrect ? 'correct' : 'wrong');
    
    const feedback = document.getElementById(`feedback-${qIndex}`);
    
    // Generate dictionary info
    let dictHtml = generateDictHtml(clickedText);

    if (isCorrect) {
        optsContainer.classList.add('locked');
        feedback.className = 'feedback success';
        feedback.innerHTML = `<strong>Chính xác!</strong> ${q.exp} <hr style="margin: 10px 0; border: 0; border-top: 1px solid #a7f3d0;"> ${dictHtml}`;
    } else {
        feedback.className = 'feedback error';
        feedback.innerHTML = `<strong>Chưa đúng!</strong> Hãy thử lại nhé. Lưu ý: ${q.exp} <hr style="margin: 10px 0; border: 0; border-top: 1px solid #fecaca;"> ${dictHtml}`;
    }
}

// Hàm phát âm
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

// Hàm phân tích từ vựng
function generateDictHtml(text) {
    if (!window.offlineDict) return '';
    const words = text.replace(/[.,!?]/g, '').split(/\s+/);
    if (words.length === 0 || text.trim() === '') return '';
    
    let html = '<div style="font-size: 0.9rem; margin-top: 5px; color: #1e293b;"><strong>📚 Phân tích từ vựng:</strong><ul style="margin-top: 5px; padding-left: 20px; list-style-type: square;">';
    
    words.forEach(w => {
        let cleanWord = w.toLowerCase().trim();
        if(!cleanWord) return;
        let dictEntry = window.offlineDict[cleanWord];
        if (dictEntry) {
            html += `<li style="margin-bottom:3px;"><span style="color:#2563eb; font-weight:bold; cursor:pointer; text-decoration:underline" onclick="event.stopPropagation(); speakText('${cleanWord.replace(/'/g, "\\'")}')">${cleanWord}</span> <span style="color:#64748b">${dictEntry.ipa}</span> - <i>${dictEntry.type}</i>: ${dictEntry.meaning}</li>`;
        } else {
            html += `<li style="margin-bottom:3px;"><span style="color:#2563eb; font-weight:bold; cursor:pointer; text-decoration:underline" onclick="event.stopPropagation(); speakText('${cleanWord.replace(/'/g, "\\'")}')">${cleanWord}</span> - <i>Từ vựng</i></li>`;
        }
    });
    
    html += '</ul><div style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">* Click vào từng chữ màu xanh để nghe phát âm lại.</div></div>';
    return html;
}

function recordMistake(unitId, question) {
    if (!mistakesRecord[unitId]) mistakesRecord[unitId] = [];
    if (!mistakesRecord[unitId].find(m => m.q === question.q)) {
        mistakesRecord[unitId].push(question);
        localStorage.setItem('grammar_mistakes', JSON.stringify(mistakesRecord));
    }
}

function showReport() {
    switchTab('report');
    const container = document.getElementById('report-content');
    
    const total = currentUnit.questions.length;
    let attempted = userAnswers.filter(a => a !== null).length;
    
    let html = `
        <div class="report-card">
            <h2>Kết quả Mini Test - Unit ${currentUnit.id}</h2>
            <p>Số câu đã làm: ${attempted} / ${total}</p>
            <div class="score-circle">${score}/${total}</div>
            <p>Bạn đúng ${score} câu ngay ở lần trả lời đầu tiên.</p>
    `;
    
    const mistakes = mistakesRecord[currentUnit.id] || [];
    if (mistakes.length > 0) {
        html += `<div class="mistakes-list">
            <h3 style="color:var(--danger)">Các câu thường sai:</h3>
        `;
        mistakes.forEach(m => {
            html += `
                <div class="mistake-item">
                    <strong>Câu hỏi:</strong> ${m.q}<br>
                    <strong>Đáp án đúng:</strong> ${m.opts[m.ans]}<br>
                    <div style="margin-top:0.5rem; font-size:0.9rem; color:var(--text-muted)">${m.exp}</div>
                </div>
            `;
        });
        html += `</div>`;
    }
    
    html += `<button class="submit-btn" onclick="loadUnit(currentUnit.id)">Làm Lại Unit Này</button></div>`;
    container.innerHTML = html;
}

</script>
</body>
</html>
